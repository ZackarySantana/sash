name: test

on:
    push:
    pull_request:

jobs:
    go:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Counter web TypeScript
              working-directory: examples/counter/web
              run: bun install --frozen-lockfile && bun x tsc --noEmit

            - name: Solid/Vite embed (dist/)
              working-directory: examples/solid-vite
              run: bun install --frozen-lockfile && bun run build

            - name: Go test
              env:
                  GOFLAGS: -buildvcs=false
              run: go test ./...
