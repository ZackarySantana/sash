<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Counter</title>
        <style>
            :root {
                font-family: system-ui, sans-serif;
                color: #e8eaed;
                background: #121316;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
            }
            main {
                text-align: center;
                padding: 2rem;
            }
            #n {
                font-size: 3rem;
                font-variant-numeric: tabular-nums;
                margin: 1rem 0;
            }
            button {
                font: inherit;
                padding: 0.5rem 1rem;
                margin: 0 0.35rem;
                border-radius: 8px;
                border: 1px solid #3c4048;
                background: #1e2128;
                color: inherit;
                cursor: pointer;
            }
            button:hover {
                background: #2a2f38;
            }
            #err {
                color: #f28b82;
                margin-top: 1rem;
                min-height: 1.25rem;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Counter</h1>
            <div id="n">…</div>
            <button type="button" id="dec">−</button>
            <button type="button" id="inc">+</button>
            <div id="err"></div>
        </main>
        <script type="module">
            import { API } from "./bindings/index.js";

            const el = document.getElementById("n");
            const errEl = document.getElementById("err");

            async function refresh() {
                errEl.textContent = "";
                try {
                    el.textContent = String(await API.Get());
                } catch (e) {
                    errEl.textContent =
                        e instanceof Error ? e.message : String(e);
                }
            }

            document.getElementById("inc").onclick = async () => {
                errEl.textContent = "";
                try {
                    el.textContent = String(await API.Add(1));
                } catch (e) {
                    errEl.textContent =
                        e instanceof Error ? e.message : String(e);
                }
            };
            document.getElementById("dec").onclick = async () => {
                errEl.textContent = "";
                try {
                    el.textContent = String(await API.Add(-1));
                } catch (e) {
                    errEl.textContent =
                        e instanceof Error ? e.message : String(e);
                }
            };

            refresh();
        </script>
    </body>
</html>
